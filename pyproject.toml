[project]
name = "metrics-processor"
description = "An agent to process metrics"

version = "3.1.9"

readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { email = "matthew@davidson.engineering" },
  { name = "Matthew Davidson" },
]

classifiers = [
  "Development Status :: 1 - Planning",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "tomli >= 1.1.0 ; python_version < '3.11'",
  "prometheus_client>=0.20.0",
  "buffered>=1.0.1",
]

[project.optional-dependencies]
test = [
  "pytest >= 8.0.0",
  "mqtt-node-network>=v1.3.1",
]

[tool.uv.sources]
# buffered = { workspace = true }
# mqtt-node-network = { workspace = true }
buffered = { git = "https://github.com/generalmattza/buffered.git", rev = "v1.0.1" }
mqtt-node-network = { git = "https://github.com/generalmattza/mqtt-node-network.git", rev = "v2.2.4" }
config-loader = { git = "https://github.com/generalmattza/python-config-loader.git", rev = "v0.1.3" }

[project.urls]
homepage = "https://davidson.engineering"
repository = "https://github.com/generalmattza/metrics-processor.git"
# documentation = "https://readthedocs.org"
# changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[tool.uv]
package = true